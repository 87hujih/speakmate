services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${COMPOSE_MYSQL_DATABASE:-speakmate}
      MYSQL_USER: ${COMPOSE_MYSQL_USER:-speakmate}
      MYSQL_PASSWORD: ${COMPOSE_MYSQL_PASSWORD:-speakmate}
      MYSQL_ROOT_PASSWORD: ${COMPOSE_MYSQL_ROOT_PASSWORD:-speakmate-root}
    ports:
      - "${COMPOSE_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${COMPOSE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: speakmate-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate", "-dir", "/app/migrations"]
    environment:
      MYSQL_DSN: "${COMPOSE_MYSQL_DSN:-speakmate:speakmate@tcp(mysql:3306)/speakmate?parseTime=true&loc=UTC}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    image: speakmate-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_PORT: "${APP_PORT:-8080}"
      STORAGE_MODE: "${COMPOSE_STORAGE_MODE:-mysql}"
      MYSQL_DSN: "${COMPOSE_MYSQL_DSN:-speakmate:speakmate@tcp(mysql:3306)/speakmate?parseTime=true&loc=UTC}"
      REDIS_ENABLED: "${REDIS_ENABLED:-true}"
      REDIS_ADDR: "${COMPOSE_REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_CONNECT_TIMEOUT_SECONDS: "${REDIS_CONNECT_TIMEOUT_SECONDS:-30}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-30}"
      REQUEST_BODY_LIMIT_BYTES: "${REQUEST_BODY_LIMIT_BYTES:-12582912}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-120}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      EXTERNAL_SERVICE_TIMEOUT_SECONDS: "${EXTERNAL_SERVICE_TIMEOUT_SECONDS:-30}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      CORS_ALLOWED_METHODS: "${CORS_ALLOWED_METHODS:-GET,POST,OPTIONS}"
      CORS_ALLOWED_HEADERS: "${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai-compatible}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-30}"
      LLM_USE_MOCK: "${LLM_USE_MOCK:-true}"
      LLM_FALLBACK_TO_MOCK: "${LLM_FALLBACK_TO_MOCK:-true}"
      CORRECTION_USE_MOCK: "${CORRECTION_USE_MOCK:-true}"
      SCORING_USE_MOCK: "${SCORING_USE_MOCK:-true}"
      SUMMARY_USE_MOCK: "${SUMMARY_USE_MOCK:-true}"
      FEEDBACK_FAIL_OPEN: "${FEEDBACK_FAIL_OPEN:-true}"
      ASR_PROVIDER: "${ASR_PROVIDER:-mock}"
      ASR_BASE_URL: "${ASR_BASE_URL:-}"
      ASR_API_KEY: "${ASR_API_KEY:-}"
      ASR_MODEL: "${ASR_MODEL:-}"
      ASR_TIMEOUT_SECONDS: "${ASR_TIMEOUT_SECONDS:-30}"
      ASR_USE_MOCK: "${ASR_USE_MOCK:-true}"
      TENCENT_ASR_APP_ID: "${TENCENT_ASR_APP_ID:-}"
      TENCENT_ASR_SECRET_ID: "${TENCENT_ASR_SECRET_ID:-}"
      TENCENT_ASR_SECRET_KEY: "${TENCENT_ASR_SECRET_KEY:-}"
      TENCENT_ASR_ENGINE_TYPE: "${TENCENT_ASR_ENGINE_TYPE:-16k_en}"
      TENCENT_ASR_VOICE_FORMAT: "${TENCENT_ASR_VOICE_FORMAT:-ogg-opus}"
      TENCENT_ASR_HOTWORD_ID: "${TENCENT_ASR_HOTWORD_ID:-}"
      TENCENT_ASR_HOTWORD_LIST: "${TENCENT_ASR_HOTWORD_LIST:-}"
      TENCENT_ASR_CUSTOMIZATION_ID: "${TENCENT_ASR_CUSTOMIZATION_ID:-}"
      TENCENT_ASR_FILTER_DIRTY: "${TENCENT_ASR_FILTER_DIRTY:-0}"
      TENCENT_ASR_FILTER_MODAL: "${TENCENT_ASR_FILTER_MODAL:-0}"
      TENCENT_ASR_FILTER_PUNC: "${TENCENT_ASR_FILTER_PUNC:-0}"
      TENCENT_ASR_CONVERT_NUM_MODE: "${TENCENT_ASR_CONVERT_NUM_MODE:-1}"
      TENCENT_ASR_WORD_INFO: "${TENCENT_ASR_WORD_INFO:-0}"
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
